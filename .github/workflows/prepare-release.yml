name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.1.0 or v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be SemVer (for example 0.1.0 or v0.1.0)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: git-cliff@2.13.1

      - name: Generate release changelog
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: git cliff --tag "v$VERSION" -o CHANGELOG.md

      - name: Update Cargo package version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          manifest = path.read_text()
          package_match = re.search(r"(?ms)^\[package\]\n(.*?)(?=^\[|\Z)", manifest)
          if package_match is None:
              raise SystemExit("Could not find [package] in Cargo.toml")

          package = package_match.group(1)
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              package,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update package version")
          path.write_text(manifest[: package_match.start(1)] + updated + manifest[package_match.end(1) :])
          PY

      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile

      - name: Validate release manifest
        run: cargo check --locked

      - name: Create release preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          BRANCH: release/v${{ steps.version.outputs.value }}-rc.${{ github.run_attempt }}
          TITLE: Release v${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare for v$VERSION"
          git push origin HEAD:"$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated release preparation for **v$VERSION**.

          ## After merging

          Pull the latest main, create the version tag, and push it to trigger the cross-platform build and GitHub Release:

          \`\`\`bash
          git checkout main
          git pull --rebase
          git tag v$VERSION
          git push origin v$VERSION
          \`\`\`"
