name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Compile
        run: cargo check --locked

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        if: runner.os == 'Linux'
        run: |
          trap 'docker compose -p nats-manager-ci down --volumes --remove-orphans' EXIT
          docker compose -p nats-manager-ci up --detach --wait
          NATS_URL=nats://127.0.0.1:4222 NATS_NO_JS_URL=nats://127.0.0.1:14223 cargo test --locked --all-targets -- --nocapture

      - name: Run tests
        if: runner.os == 'macOS'
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release
