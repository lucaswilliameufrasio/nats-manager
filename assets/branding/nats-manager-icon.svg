<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="surface" x1="120" y1="104" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14233E"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <linearGradient id="signal" x1="268" y1="260" x2="770" y2="774" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CF0D2"/>
      <stop offset="0.54" stop-color="#36BFE3"/>
      <stop offset="1" stop-color="#6B8CFF"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FFFF"/>
      <stop offset="1" stop-color="#C5FFF1"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="984" height="984" rx="230" fill="url(#surface)"/>
  <rect x="22" y="22" width="980" height="980" rx="228" stroke="#B7D7F3" stroke-opacity="0.12" stroke-width="4"/>

  <circle cx="512" cy="512" r="344" stroke="#8EB4D4" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="512" cy="512" r="286" stroke="#8EB4D4" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 18"/>

  <!-- A routed N: three rails form the letter and the message path. -->
  <path d="M286 735V289L738 735V289" stroke="url(#signal)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection points make the N read as a live messaging topology. -->
  <circle cx="286" cy="289" r="54" fill="#10243A" stroke="url(#signal)" stroke-width="20"/>
  <circle cx="286" cy="735" r="54" fill="#10243A" stroke="url(#signal)" stroke-width="20"/>
  <circle cx="738" cy="735" r="54" fill="#10243A" stroke="url(#signal)" stroke-width="20"/>
  <circle cx="738" cy="289" r="54" fill="#10243A" stroke="url(#signal)" stroke-width="20"/>

  <!-- A bright message hub sits on the diagonal route. -->
  <circle cx="512" cy="512" r="76" fill="#10243A" stroke="#07111F" stroke-width="18"/>
  <circle cx="512" cy="512" r="48" fill="url(#node)"/>
  <circle cx="512" cy="512" r="19" fill="#27AFC7"/>
</svg>
