[package]
name = "nats-manager"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/lucaswilliameufrasio/nats-manager"
description = "Desktop application for managing NATS clusters"

[package.metadata.bundle]
name = "NATS Manager"
identifier = "com.lucaswilliameufrasio.nats-manager"
category = "Developer Tool"
short_description = "Desktop manager for NATS clusters"
long_description = "Inspect and administer NATS clusters with or without JetStream."
icon = ["assets/branding/nats-manager-icon.svg"]

[dependencies]
anyhow = "1.0.104"
async-nats = "0.50.0"
base64 = "0.23.1"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
nkeys = "0.4.5"
rfd = "0.17.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
