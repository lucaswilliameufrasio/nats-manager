[package]
name = "nats-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-nats = "0.50.0"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
